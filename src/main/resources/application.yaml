

spring:
  application:
    name: dynamic-captcha
  webflux:
    base-path: /
  web:
    # Expose ResponseStatusException reasons (e.g. why a captcha request was rejected) to the caller
    error:
      include-message: always
  netty:
    leak-detection: PARANOID

management:
  endpoint.health.show-details: always
  endpoints.web.exposure:
    include: '*'
    exclude: 'shutdown'

logging:
  level:
    root: INFO

server:
  port: 8061